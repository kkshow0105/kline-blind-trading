<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="逐日揭示历史K线的离线人工买卖实验。">
  <title>K线盲测</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
<main>
  <header class="masthead">
    <div><h1>K线盲测</h1><p id="instrument">正在载入本地行情…</p></div>
    <button id="install" hidden>安装应用</button>
  </header>
  <div id="update-banner" class="update" hidden><span id="update-label"></span><button id="update">立即更新</button></div>
  <section id="workspace" class="workspace" hidden>
    <article class="chart-panel">
      <div class="chart-tools">
        <strong>日K与成交量</strong>
        <div class="tool-buttons">
          <button id="zoom-in" aria-label="放大">＋</button>
          <button id="zoom-out" aria-label="缩小">−</button>
          <button id="all">全部</button>
          <button id="latest">当前</button>
        </div>
      </div>
      <dl class="quotes" id="quotes"></dl>
      <div class="ma" id="ma"></div>
      <p id="trade-detail" hidden></p>
      <canvas id="chart" aria-label="已揭示日K、均线和成交量"></canvas>
      <div class="chart-footer"><span id="chart-start"></span><span id="chart-end"></span></div>
    </article>
    <aside id="controls" class="controls" aria-label="交易决定">
      <div class="decision-heading">
        <div><span class="muted">当前决策日</span><strong id="day"></strong></div>
        <span id="step"></span>
      </div>
      <progress id="progress" aria-label="盲测进度"></progress>
      <div class="account"><strong id="position"></strong><span id="hint"></span></div>
      <p class="muted" id="position-detail" hidden></p>
      <div id="flat" class="decisions" hidden>
        <button id="buy" class="primary">买入</button><button id="watch">观望</button>
        <button id="scan" class="candidate">跳至下一候选</button>
      </div>
      <div id="holding" class="decisions" hidden>
        <button id="sell" class="primary">卖出</button><button id="hold">继续持有</button>
      </div>
      <button id="reveal" class="primary full" hidden>查看回测结果</button>
    </aside>
  </section>
  <p id="status" class="status" role="status"></p>
  <section id="report" class="result" hidden>
    <div class="result-head">
      <h2>本次盲测成绩</h2>
      <button id="reset" class="danger">清除测试数据，重新开始</button>
    </div>
    <div class="score-block">
      <p id="score"></p>
      <p id="score-caption"></p>
      <button id="share" class="primary">分享成绩</button>
    </div>
    <dl id="metrics" class="metrics"></dl>
    <h3>逐笔交易</h3>
    <p class="muted">点击买入日期定位K线。最高浮盈和最大不利波动以买入价为基准，未扣成本。</p>
    <div id="trades" class="trades"></div>
    <details><summary>原 G1 程序买卖对照</summary>
      <p class="muted">原 G1 买卖皆由程序决定。本次盲测的进场和退出都由人工决定。</p>
      <dl id="baseline" class="metrics"></dl><div id="baseline-trades" class="trades"></div>
    </details>
    <details><summary>查看候选及决定</summary><ul id="candidates" class="candidates"></ul></details>
  </section>
  <footer><span id="version">K线盲测</span><span id="offline"></span></footer>
</main>
<dialog id="confirm"><form method="dialog">
  <h2>清除本轮记录？</h2>
  <p>当前样本的全部操作、进度和成绩将被删除，无法撤销。重复测试同一段历史行情可能受到已有记忆影响。</p>
  <div class="dialog-buttons"><button value="cancel" autofocus>取消</button><button value="clear" class="danger">清除并重新开始</button></div>
</form></dialog>
<dialog id="share-dialog">
  <h2>分享成绩</h2>
  <img id="share-preview" alt="K线盲测成绩图片">
  <div class="dialog-buttons"><form method="dialog"><button>关闭</button></form><a id="save-image" class="button primary">保存图片</a></div>
</dialog>
</body>
</html>
